release: "2.38.2"
purpose: real_hardware_and_vizdoom_execution_readiness_with_campaign_storage_reserve

preflight:
  require_cuda: true
  min_cuda_vram_gib: 16.0
  min_disk_free_gib: 100.0
  min_system_ram_gib: 32.0
  require_vizdoom: true
  require_transformers: true
  require_vjepa_cache: false
  vjepa_model: facebook/vjepa2-vitl-fpc64-256

qualification_targets:
  structured_vizdoom_config: configs/v2_35_vizdoom_structured.yaml
  pixel_vjepa_config: configs/v2_35_vizdoom_pixel.yaml
  dream_rsi_config: configs/v2_34_dream_rsi_empirical.yaml
  planner_batch_limits: [0, 32, 8, 4, 1]

claim_boundary:
  - Preflight readiness is not benchmark evidence.
  - The 100 GiB free-space floor is an operational reserve, not a prediction that training will consume 100 GiB.
  - Real ViZDoom receipts require the native ViZDoom backend.
  - Pixel qualification requires a non-injected V-JEPA backbone.
  - Planner schedule results must keep logical search work matched.
