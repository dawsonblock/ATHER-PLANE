release: "2.21.0"
purpose: evolving_campaign_closure

research_boundary:
  arbitrary_source_rewrite: false
  replay_can_promote_without_online_validation: false
  simulated_evidence_can_support_empirical_claims: false
  runner_uses_shell: false
  execute_requires_explicit_flag: true

active_policy:
  policy_id: active
  quality_weight: 1.0
  novelty_weight: 0.25
  uncertainty_weight: 0.20
  transfer_weight: 0.30
  information_weight: 0.20
  cost_weight: 0.10
  new_world_bias: 0.35
  stop_threshold: -0.05
  max_parallel: 4
  new_world_fraction: 0.20
  adversarial_fraction: 0.10

meta_exploration:
  replay:
    max_rounds: 64
    objective:
      quality_weight: 1.0
      transfer_weight: 0.25
      information_weight: 0.10
      uncertainty_weight: 0.10
      compute_cost_weight: 0.10
      latency_weight: 0.001
      constraint_violation_weight: 1.0
  mutation:
    step: 0.10
    minimum_new_world_fraction: 0.10
    minimum_adversarial_fraction: 0.05
    minimum_replay_gain: 0.0
  promotion:
    maximum_per_seed_regression: 0.05

metric_projection:
  quality_metric: success_rate
  novelty_metric: novelty
  uncertainty_reduction_metric: uncertainty_reduction
  transfer_metric: success_rate
  information_gain_metric: information_gain
  constraint_metric: constraint_violations
  compute_cost_metric: normalized_compute_cost
  latency_metric: wall_clock_seconds
  latency_scale: 0.0002777777777777778  # seconds -> hours

validation:
  seeds: [1701, 1702, 1703, 1704, 1705]
  tasks: [vizdoom]
  splits: [heldout, transfer]
  milestones: [25000]
  primary_metric: success_rate
  minimum_seeds: 5

# Plan mode does not need a runner. To use --execute, set argv to a real adapter.
# The adapter receives an exact policy/seed/task/split/milestone cell and must write
# an awa-v2.21-campaign-evidence-v1 JSON document to {output}.
runner:
  type: subprocess
  timeout_seconds: 86400
  argv: []
