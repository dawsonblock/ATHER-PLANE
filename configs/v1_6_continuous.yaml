seed: 11
device: auto

env:
  kind: continuous_point
  action_type: continuous
  horizon: 40
  obs_dim: 4
  action_dim: 2
  action_low: [-1.0, -1.0]
  action_high: [1.0, 1.0]
  step_scale: 0.15
  success_radius: 0.10

model:
  obs_dim: 4
  latent_dim: 32
  deterministic_dim: 64
  stochastic_dim: 16
  dynamics: gru
  action_dim: 2
  hidden_dim: 96
  slow_enabled: true
  slow_dim: 32
  slow_stride: 4
  uncertainty_heads: 4
  experts_enabled: false
  actor_log_std_min: -5.0
  actor_log_std_max: 1.0

planner:
  enabled: true
  horizon: 8
  candidates: 128
  elites: 16
  iterations: 3
  min_std: 0.03
  momentum: 0.10
  uncertainty_limit: 1.5
  adaptive: true
  uncertainty_low: 0.25
  uncertainty_medium: 0.60
  uncertainty_high: 0.85
  min_horizon: 2
  min_candidates: 24
  calibrated_uncertainty: false
  learned_gate: false

training:
  steps: 1200
  batch_size: 16
  sequence_length: 12
  burn_in: 2
  overshoot_horizon: 3
  overshoot_coef: 0.10
  replay_capacity: 100000
  prioritized_replay: true
  priority_alpha: 0.6
  priority_beta: 0.4
  lr: 0.0003
  actor_lr: 0.0002
  value_lr: 0.0003
  grad_clip: 10.0
  free_nats: 0.1
  imagination_horizon: 8
  discount: 0.99
  lambda: 0.95
  entropy_coef: 0.001
  advantage_normalize: true
  target_tau: 0.01
  epsilon_start: 0.30
  epsilon_final: 0.03
  checkpoint_every: 600
  checkpoint_replay: true
  log_every: 25

acceptance:
  success_improvement_pct: 5
  sample_efficiency_pct: 15
  robustness_pct: 20
  compute_reduction_pct: 20
  max_critical_regression_pct: 3
