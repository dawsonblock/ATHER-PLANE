[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-world-agent"
version = "2.38.6"
description = "Policy-first hierarchical world-model agent research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Architect Block"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
graphs = ["networkx>=3.2", "pandas>=2.2"]
gym = ["gymnasium>=0.29"]
dmcontrol = ["dm-control>=1.0.20"]
faiss = ["faiss-cpu>=1.8"]
mamba = ["mamba-ssm>=2.2"]
hf = ["transformers>=4.57.3", "pillow>=10.0"]
vjepa = ["transformers>=4.57.3", "pillow>=10.0"]
vizdoom = ["vizdoom>=1.2"]
doom-vjepa = ["vizdoom>=1.2", "transformers>=4.57.3", "pillow>=10.0"]
metaworld = ["metaworld"]

[project.scripts]
awa-smoke = "awa.cli:smoke_main"
awa-continuous-smoke = "awa.cli:continuous_smoke_main"
awa-train = "awa.cli:train_main"
awa-eval = "awa.cli:eval_main"
awa-connectome = "awa.cli:connectome_main"
awa-benchmark = "awa.cli:benchmark_main"
awa-robustness = "awa.cli:robustness_main"
awa-suite = "awa.cli:suite_main"
awa-ablation = "awa.cli:ablation_main"
awa-matrix = "awa.cli:matrix_main"
awa-provenance = "awa.cli:provenance_main"
awa-calibrate = "awa.cli:calibrate_main"
awa-gate-fit = "awa.cli:gate_fit_main"
awa-env-check = "awa.cli:env_check_main"
